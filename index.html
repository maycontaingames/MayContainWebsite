<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May Contain Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='white' stroke='black' stroke-width='3'/%3E%3Crect x='7' y='8' width='18' height='5' fill='black'/%3E%3Crect x='7' y='17' width='18' height='2' fill='black'/%3E%3Crect x='7' y='22' width='12' height='2' fill='black'/%3E%3C/svg%3E">
<meta name="description" content="May Contain Games is an independent game studio. Contents may settle during shipping.">
<style>
  :root {
    --paper: #fdfdfb;
    --ink: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101010;
      --ink: #f2f2ef;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  /* One knob scales the whole label: everything below is em-based. */
  .label {
    font-size: clamp(15px, 4vw, 19px);
    border: 0.16em solid var(--ink);
    padding: 1.4em 1.6em 1.6em;
    width: 100%;
    max-width: 30em;
  }
  h1 {
    font-size: 2.7em;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-transform: uppercase;
  }
  .rule {
    border: none;
    border-top: 0.55em solid var(--ink);
    margin: 0.8em 0 0.7em;
  }
  .rule.thin {
    border-top-width: 1px;
    margin: 0.6em 0;
  }
  .row {
    font-size: 1em;
    line-height: 1.5;
  }
  .row strong { font-weight: 700; }
  .fine {
    font-size: 0.72em;
    line-height: 1.5;
    margin-top: 1em;
  }
  a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <main class="label">
    <h1>May Contain Games</h1>
    <hr class="rule">
    <p class="row"><strong>Contents:</strong> an independent game studio.</p>
    <hr class="rule thin">
    <p class="row"><strong>May contain:</strong> up to 100% game.</p>
    <hr class="rule thin">
    <p class="row"><strong>Contact:</strong> <a href="mailto:maycontaindev@gmail.com">maycontaindev@gmail.com</a></p>
    <p class="fine">Produced in a facility that may contain production. Contents may have settled during development.</p>
  </main>
</body>
</html>
